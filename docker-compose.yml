services:
  app:
    build:
      context: .
      args:
        # Baked into the client bundle at build time (same as Next.js locally).
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3002}
        NEXT_PUBLIC_APP_SCHEME: ${NEXT_PUBLIC_APP_SCHEME:-lakumarketplace}
        NEXT_PUBLIC_ANDROID_STORE_URL: ${NEXT_PUBLIC_ANDROID_STORE_URL:-https://play.google.com/store/apps/details?id=com.laku.marketplace}
        NEXT_PUBLIC_IOS_STORE_URL: ${NEXT_PUBLIC_IOS_STORE_URL:-https://apps.apple.com/app/laku}
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL:-http://localhost:3000}
        NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN:-}
    ports:
      - "3002:3002"
    env_file: .env
    # Server-side API base: inside the container, localhost is the container itself —
    # never reuse LAKU_API_BASE_URL from .env (that value is for host npm and is usually
    # http://localhost:3000). Use DOCKER_LAKU_API_BASE_URL only if Dashboard is not on the host.
    environment:
      LAKU_API_BASE_URL: ${DOCKER_LAKU_API_BASE_URL:-http://host.docker.internal:3000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3002}
      NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL:-http://localhost:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
